name: Health check
on:
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-22.04
    steps:
      - name: Check deployed site health
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://vsme-datakortit.onrender.com/
          follow-redirect: true
          max-attempts: 3
          retry-delay: 10s
